name: scale-sqlite-auto-enable
fixture: context-search

request: |
  Knowledge件数が規模閾値へ達した状態で、本文だけにある日本語を検索して。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - tools/REFERENCE.md
    - tools/build-context-cache.sh
    - tools/find-context.sh
  must_run:
    - AGENT_SQLITE_KNOWLEDGE_THRESHOLD=1 tools/build-context-cache.sh
    - tools/find-context.sh --route knowledge --limit 5 -- "投下先ごとの期待収益"
  must_set:
    - .agent-cache/cache.meta#search_backend=sqlite-fts5
