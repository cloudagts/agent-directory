name: knowledge-log-auto-rotation

request: |
  999記録あるKnowledge logへ、1件の変更履歴を追加して。

expect:
  route: meta
  must_read:
    - AGENTS.md
    - knowledge/KNOWLEDGE.md
    - tools/REFERENCE.md
    - tools/append-knowledge-log.sh
  must_run:
    - tools/append-knowledge-log.sh --type lint --target fixture/1000 --summary "threshold fixture"
  must_set:
    - knowledge/wiki/logs/YYYY-QN.md#records=1000
    - knowledge/wiki/LOG.md#records=0
  must_report:
    - threshold-rotation-is-deterministic-and-runs-without-asking
    - the-user-does-not-choose-how-to-split-the-log
  must_not_modify:
    - knowledge/wiki/logs/**
